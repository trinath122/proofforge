[project]
name = "proofforge"
version = "0.1.0"
description = "A development agent that never says 'done' without proof. Built on Nebius Token Factory Sandboxes and NVIDIA Nemotron."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "contree-sdk>=0.3.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
proofforge = "proofforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Benchmark content is deliberately buggy or mirrors real-world style; never auto-fix it.
extend-exclude = ["bench/*/cases", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S108", "ASYNC240"]
"bench/**/tools/*" = ["S311", "S608", "PLR0912", "PLR0915", "PLR0917", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["contree_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not live' --cov=proofforge --cov-report=term-missing --cov-fail-under=85"
markers = ["live: hits real Nebius APIs; run with `-m live` and credentials set"]

[tool.coverage.run]
omit = ["src/proofforge/cli.py", "src/proofforge/sandbox/contree.py", "src/proofforge/llm/client.py",
    "src/proofforge/playbooks/assets/*",  # run inside the sandbox; exercised via subprocess in tests
]
